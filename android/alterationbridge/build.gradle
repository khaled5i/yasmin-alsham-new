apply plugin: 'com.android.application'

if (project.hasProperty('alterationBridgeBuildDir')) {
    layout.buildDirectory = file(project.property('alterationBridgeBuildDir'))
}

def stationEnv = [:]
def stationEnvFile = new File(rootProject.projectDir, '../.env.local')
if (stationEnvFile.exists()) {
    stationEnvFile.eachLine('UTF-8') { rawLine ->
        def line = rawLine.trim()
        if (line && !line.startsWith('#')) {
            def separator = line.indexOf('=')
            if (separator > 0) {
                def key = line.substring(0, separator).trim()
                def value = line.substring(separator + 1).trim()
                if ((value.startsWith('"') && value.endsWith('"'))
                        || (value.startsWith("'") && value.endsWith("'"))) {
                    value = value.substring(1, value.length() - 1)
                }
                stationEnv[key] = value
            }
        }
    }
}

def buildConfigString = { String value ->
    def escaped = (value ?: '')
            .replace('\\', '\\\\')
            .replace('"', '\\"')
            .replace('\r', '')
            .replace('\n', '')
    return "\"${escaped}\""
}

android {
    namespace = "com.yasminalsham.alterationbridge"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.yasminalsham.alterationbridge"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "SUPABASE_URL",
                buildConfigString(stationEnv['NEXT_PUBLIC_SUPABASE_URL'] as String)
        buildConfigField "String", "SUPABASE_ANON_KEY",
                buildConfigString(stationEnv['NEXT_PUBLIC_SUPABASE_ANON_KEY'] as String)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            // Internal distribution: release optimizations with the workstation's stable debug key.
            // Replace with a dedicated private signing config before any public-store release.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "androidx.core:core:$androidxCoreVersion"
}
